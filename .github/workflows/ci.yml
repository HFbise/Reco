name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend + end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest ruff==0.16.9 "python-socketio[client]" playwright==1.63.0
      - name: Browser for end-to-end tests
        run: python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - run: pytest tests -q
      - name: Screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e-failures/
          if-no-files-found: ignore
      - name: Production server smoke test (gunicorn + WebSocket)
        run: python tests/smoke_gunicorn.py
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  frontend:
    name: Frontend lint, typecheck & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Production web build (what build.sh runs on Render)
        run: npx expo export -p web && test -f dist/index.html
