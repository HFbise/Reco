    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      /* In-app browsers (and mobile Safari) can report a 100% height that runs
         under their toolbars; the dynamic viewport height is what's visible. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* App typeface. react-native-web sets a system font on every Text and
         TextInput through a class; these selectors outrank that class, while a
         component's own fontFamily (headings use Fredoka) still wins. Chinese
         falls back to the platform's CJK font. */
      body [dir],
      body input[class],
      body textarea[class] {
        font-family: Nunito, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      }
      /* iOS zooms into any focused input under 16px and never zooms back out,
         which leaves the page cropped. Touch screens get 16px inputs instead. */
      @media (pointer: coarse) {
        input,
        textarea {
          font-size: 16px !important;
        }
      }
    </style>
  <link rel="icon" href="/favicon.ico" /></head>
