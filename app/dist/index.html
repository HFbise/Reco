<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Reco</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installed to the home screen: phones don't use SVG icons, so these are PNGs -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reco" />
    <!-- Status bar color (iOS 15+, Android). Matches the app ground; the app
         replaces these with one tag that follows its own light/dark switch. -->
    <meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17191E" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f3f5fa;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #17191e;
        }
      }
      /* In-app browsers (and mobile Safari) can report a 100% height that runs
         under their toolbars; the dynamic viewport height is what's visible. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* App typefaces. react-native-web gives every Text and TextInput a system
         font through a class (and turns a component's fontFamily into a class
         too); these selectors outrank both. Body text is Nunito; text marked
         data-font="display" (the DisplayText component) is Fredoka. Chinese
         falls back to the platform's CJK font. */
      body [dir],
      body input[class],
      body textarea[class] {
        font-family: Nunito, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      }
      body [data-font='display'] {
        font-family: Fredoka, Nunito, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      }
      /* iOS zooms into any focused input under 16px and never zooms back out,
         which leaves the page cropped. Touch screens get 16px inputs instead. */
      @media (pointer: coarse) {
        input,
        textarea {
          font-size: 16px !important;
        }
      }
    </style>
  <link rel="icon" href="/favicon.ico" /></head>
