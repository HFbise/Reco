[tool.ruff]
line-length = 120
src = [".", "server"]  # the backend's modules import each other by name from server/
target-version = "py311"
extend-exclude = ["app", "extract_group.py"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplifications
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # long SQL / HTML lines read better unwrapped; the formatter handles code
    "SIM105",  # try/except/pass is clearer than contextlib.suppress in handlers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # conftest must set env vars before importing the app
"server/app.py" = ["E402"]    # load_dotenv() / logging setup must run before app imports
"wsgi.py" = ["E402"]          # server/ goes on sys.path first

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]

[tool.ruff.format]
quote-style = "single"
