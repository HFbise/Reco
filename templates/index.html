<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reco</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/app-logo.png">
  <style>
    /* ── Reset ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f0f3; color: #2e3338; overflow: hidden; height: 100vh; }
    body.dark { background: #2a2b2f; color: #e0e0e5; }

    /* ── Top Bar ── */
    #topbar { height: 52px; background: #fff; border-bottom: 1px solid rgba(0,0,0,0.08); display: flex; align-items: center; padding: 0 16px 0 20px; gap: 10px; flex-shrink: 0; }
    body.dark #topbar { background: #1e1f23; border-color: rgba(255,255,255,0.08); }
    #topbar-logo { height: 24px; display: block; }
    body.dark #topbar-logo { filter: brightness(0) invert(1); }
    #topbar-spacer { flex: 1; }
    #topbar-right { display: flex; align-items: center; gap: 6px; }
    #topbar-user-avatar { cursor: pointer; flex-shrink: 0; transition: transform 0.15s; display: none; }
    #topbar-user-avatar:hover { transform: scale(1.08); }
    #topbar-name { font-size: 0.88rem; font-weight: 600; cursor: pointer; margin: 0 4px; white-space: nowrap; display: none; }
    #topbar-name:hover { opacity: 0.75; }
    .topbar-icon-btn { background: none; border: none; cursor: pointer; padding: 5px; border-radius: 6px; display: flex; align-items: center; justify-content: center; opacity: 0.6; transition: opacity 0.12s, background 0.12s; color: inherit; }
    .topbar-icon-btn:hover { opacity: 1; background: rgba(0,0,0,0.07); }
    body.dark .topbar-icon-btn:hover { background: rgba(255,255,255,0.07); }
    .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; border-radius: 5px; display: flex; align-items: center; justify-content: center; opacity: 0.55; transition: opacity 0.12s, background 0.12s; color: inherit; }
    .icon-btn:hover { opacity: 1; background: rgba(0,0,0,0.07); }
    body.dark .icon-btn:hover { background: rgba(255,255,255,0.07); }
    #login-open-btn { background: #4f8ef7; color: white; border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 0.83rem; white-space: nowrap; }
    #login-open-btn:hover { background: #3a7be0; }
    #logout-btn { display: none; }

    /* ── Mobile Topbar ── */
    #mobile-topbar { display: none; align-items: center; gap: 10px; padding: 0 12px; height: 50px; background: #fff; border-bottom: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; position: relative; z-index: 10; }
    body.dark #mobile-topbar { background: #1e1f23; border-color: rgba(255,255,255,0.08); }
    #mobile-topbar .mt-room { flex: 1; font-size: 0.95rem; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mt-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: inherit; opacity: 0.7; font-size: 1.1rem; }
    .mt-btn:hover { opacity: 1; background: rgba(128,128,128,0.12); }

    /* ── Main Layout ── */
    #app { display: flex; height: calc(100vh - 52px); overflow: hidden; }

    /* ── Left Sidebar ── */
    #sidebar { width: 300px; min-width: 300px; background: #fff; border-right: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    body.dark #sidebar { background: #252528; border-color: rgba(255,255,255,0.07); }
    #sidebar-header { padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: relative; }
    #sidebar-chats-label { font-size: 1rem; font-weight: 700; }
    #plus-btn { background: none; border: none; cursor: pointer; color: #4f8ef7; padding: 3px 5px; border-radius: 5px; display: flex; align-items: center; transition: background 0.12s; }
    #plus-btn:hover { background: rgba(79,142,247,0.1); }
    #plus-dropdown { position: absolute; top: calc(100% - 4px); right: 12px; background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.18); overflow: hidden; z-index: 200; min-width: 160px; }
    body.dark #plus-dropdown { background: #383a40; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
    .plus-menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; font-size: 0.9rem; color: #2e3338; border: none; background: none; width: 100%; text-align: left; transition: background 0.1s; }
    body.dark .plus-menu-item { color: #dbdee1; }
    .plus-menu-item:hover { background: rgba(0,0,0,0.06); }
    body.dark .plus-menu-item:hover { background: rgba(255,255,255,0.07); }
    #sidebar-search { padding: 0 10px 8px; flex-shrink: 0; }
    .search-wrap { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.06); border-radius: 8px; padding: 7px 12px; }
    body.dark .search-wrap { background: rgba(0,0,0,0.25); }
    #room-search { flex: 1; border: none; background: none; color: inherit; font-size: 0.88rem; outline: none; }
    #room-search::placeholder { color: #87888c; }
    #room-list { flex: 1; overflow-y: auto; padding: 2px 8px; display: flex; flex-direction: column; gap: 1px; }
    .room-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 0.92rem; color: #5c5e66; transition: background 0.12s, color 0.12s; border: none; background: none; width: 100%; text-align: left; }
    .room-item:hover { background: rgba(0,0,0,0.05); color: #2e3338; }
    body.dark .room-item { color: #949ba4; }
    body.dark .room-item:hover { background: rgba(255,255,255,0.05); color: #e0e0e5; }
    .room-item.active { background: rgba(79,142,247,0.12); color: #2e3338; font-weight: 500; }
    body.dark .room-item.active { background: rgba(79,142,247,0.2); color: #e0e0e5; }
    .room-icon { flex-shrink: 0; display: flex; align-items: center; }
    .room-name-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-lock { font-size: 0.72rem; opacity: 0.5; }

    /* ── Chat Area ── */
    #chat-area { flex: 1; display: flex; min-width: 0; overflow: hidden; background: #f0f0f3; }
    body.dark #chat-area { background: #2a2b2f; }
    #no-room { flex: 1; display: flex; align-items: center; justify-content: center; color: #87888c; font-size: 1.05rem; }
    #chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    #chat-header { height: 50px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #f0f0f3; border-bottom: 1px solid rgba(0,0,0,0.07); flex-shrink: 0; }
    body.dark #chat-header { background: #2a2b2f; border-color: rgba(255,255,255,0.07); }
    #chat-title { background: none; border: none; cursor: pointer; font-size: 0.97rem; font-weight: 600; color: inherit; padding: 4px 8px; border-radius: 5px; display: inline-flex; align-items: center; gap: 8px; transition: background 0.12s; width: fit-content; max-width: 60%; }
    #chat-title:hover { background: rgba(0,0,0,0.05); }
    body.dark #chat-title:hover { background: rgba(255,255,255,0.05); }
    .ch-right { display: flex; align-items: center; gap: 4px; }

    /* ── Messages ── */
    #messages { flex: 1; overflow-y: auto; padding: 12px 0 10px; display: flex; flex-direction: column; gap: 0; min-height: 0; }
    .msg { display: flex; align-items: flex-start; gap: 10px; padding: 5px 16px; }
    .msg.system { justify-content: center; padding: 6px 16px; }
    .msg-separator { text-align: center; color: #87888c; font-size: 0.74rem; padding: 10px 16px; }
    .msg-av { flex-shrink: 0; margin-top: 2px; }
    .msg-body { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
    .msg-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; cursor: pointer; display: block; }
    .msg-name:hover { text-decoration: underline; }
    .msg-bubble { background: #fff; border-radius: 12px; padding: 10px 14px; display: inline-block; max-width: 100%; word-break: break-word; }
    body.dark .msg-bubble { background: #383940; }
    .msg-text { font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap; color: #2e3338; }
    body.dark .msg-text { color: #e0e0e5; }
    .msg.system .msg-sys-text { font-size: 0.79rem; color: #87888c; }
    .msg.own { flex-direction: row-reverse; }
    .msg.own .msg-body { align-items: flex-end; }
    .msg.own .msg-bubble { background: #4f8ef7; }
    .msg.own .msg-text { color: #fff; }

    /* ── Input Area ── */
    #input-area { padding: 10px 16px 14px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; background: #f0f0f3; }
    body.dark #input-area { background: #2a2b2f; }
    #msg-input { flex: 1; padding: 11px 16px; border: none; border-radius: 10px; background: #e4e4e8; color: inherit; font-size: 0.95rem; outline: none; }
    body.dark #msg-input { background: #383940; color: #e0e0e5; }
    #msg-input::placeholder { color: #87888c; }
    #send-btn { background: #4f8ef7; border: none; border-radius: 10px; cursor: pointer; padding: 10px 14px; display: flex; align-items: center; justify-content: center; transition: background 0.12s; flex-shrink: 0; }
    #send-btn:hover { background: #3a7be0; }

    /* ── Right Sidebar ── */
    #members-sidebar { width: 230px; min-width: 230px; background: #fff; border-left: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow-y: auto; }
    body.dark #members-sidebar { background: #252528; border-color: rgba(255,255,255,0.07); }

    /* ── Voice Section ── */
    #voice-section { padding: 14px 14px 10px; flex-shrink: 0; }
    #voice-section-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; }
    #voice-join-btn { width: 100%; padding: 9px; background: #4f8ef7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.88rem; font-weight: 600; transition: background 0.12s; margin-bottom: 8px; }
    #voice-join-btn:hover { background: #3a7be0; }
    #voice-in-controls { display: none; align-items: center; gap: 8px; margin-bottom: 8px; }
    #voice-in-controls.show { display: flex; }
    .voice-icon-btn { border: none; border-radius: 7px; cursor: pointer; padding: 8px 10px; display: flex; align-items: center; justify-content: center; color: white; transition: background 0.12s; flex-shrink: 0; }
    #mic-toggle { background: #4f8ef7; }
    #mic-toggle:hover { background: #3a7be0; }
    #mic-toggle.muted { background: #ed4245; }
    #speaker-toggle { background: #4f8ef7; }
    #speaker-toggle:hover { background: #3a7be0; }
    #speaker-toggle.muted { background: #ed4245; }
    #voice-leave-btn { background: #ed4245; color: white; border: none; border-radius: 7px; cursor: pointer; padding: 8px 14px; font-size: 0.86rem; font-weight: 600; flex: 1; transition: background 0.12s; }
    #voice-leave-btn:hover { background: #c03537; }
    #voice-members-list { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
    .voice-member { display: flex; align-items: center; gap: 8px; padding: 3px 2px; font-size: 0.86rem; }
    .voice-member.speaking .voice-av-wrap { outline: 2px solid #3ba55c; border-radius: 50%; }
    .voice-icon { font-size: 0.78rem; color: #87888c; flex-shrink: 0; }
    .voice-vol-row { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
    .voice-vol-row input[type=range] { flex: 1; min-width: 0; }
    #stream-audio-btn { display: none; width: 100%; padding: 5px 8px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.79rem; background: #4f5660; color: white; margin-top: 3px; text-align: left; }
    #stream-audio-btn.active { background: #ed4245; }
    #live-btn { display: none; width: 100%; padding: 5px 8px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.79rem; background: #9b59b6; color: white; margin-top: 3px; text-align: left; }
    #live-btn.active { background: #ed4245; }
    #stream-audio-btn.show-ctrl, #live-btn.show-ctrl { display: block; }

    /* ── Members Section ── */
    #members-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 4px 14px; flex-shrink: 0; }
    body.dark #members-divider { background: rgba(255,255,255,0.08); }
    #sidebar-members-title { font-size: 0.88rem; font-weight: 700; padding: 10px 14px 8px; flex-shrink: 0; }
    #member-list { padding: 0 8px 12px; display: flex; flex-direction: column; gap: 1px; }
    .member-item { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; cursor: pointer; transition: background 0.1s; }
    .member-item:hover { background: rgba(0,0,0,0.05); }
    body.dark .member-item:hover { background: rgba(255,255,255,0.05); }
    .member-item.offline { opacity: 0.38; }
    .member-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.86rem; }
    .member-badge { font-size: 0.68rem; flex-shrink: 0; }

    /* ── Avatar ── */
    .av { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar-preview { display: flex; justify-content: center; margin-bottom: 12px; }
    .avatar-picker-label { font-size: 0.8rem; color: #87888c; margin-bottom: 6px; display: block; }
    .av-expr-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .av-expr-opt { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 3px solid transparent; transition: transform 0.12s, border-color 0.12s; }
    .av-expr-opt:hover { transform: scale(1.1); }
    .av-expr-opt.sel { border-color: #fff; box-shadow: 0 0 0 2px #4f8ef7; }
    .av-color-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .av-color-opt { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.12s; }
    .av-color-opt:hover { transform: scale(1.15); }
    .av-color-opt.sel { border-color: #fff; box-shadow: 0 0 0 2px #4f8ef7; }

    /* ── Stream Panel ── */
    #stream-panel { display: none; flex-shrink: 0; background: #111; height: 240px; min-height: 90px; overflow: hidden; }
    #stream-panel.active { display: flex; flex-direction: column; }
    #stream-grid { flex: 1; display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; overflow: hidden; align-content: stretch; }
    .stream-card { position: relative; flex: 1; min-width: 160px; background: #000; border-radius: 4px; overflow: hidden; }
    .stream-card video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .stream-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #555; font-size: 0.85rem; }
    .stream-card-label { position: absolute; bottom: 5px; left: 8px; color: white; font-size: 0.78rem; text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 3px; }
    .stream-card-btns { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; transition: opacity 0.15s; }
    .stream-card:hover .stream-card-btns { opacity: 1; }
    .stream-card-btn { background: rgba(0,0,0,0.55); border: none; color: white; border-radius: 4px; cursor: pointer; padding: 2px 7px; font-size: 0.8rem; }
    #stream-resize-handle { display: none; height: 5px; background: #ccc; cursor: ns-resize; flex-shrink: 0; user-select: none; }
    body.dark #stream-resize-handle { background: #2a2a3e; }
    #stream-resize-handle:hover, #stream-resize-handle.dragging { background: #4f8ef7; }
    #stream-resize-handle.active { display: block; }
    .stream-floater { position: fixed; z-index: 500; width: 360px; height: 220px; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 28px rgba(0,0,0,0.7); resize: both; min-width: 200px; min-height: 120px; }
    .stream-floater video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .stream-floater-bar { position: absolute; top: 0; left: 0; right: 0; height: 30px; background: linear-gradient(rgba(0,0,0,0.75), transparent); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; cursor: grab; z-index: 1; }
    .stream-floater-bar:active { cursor: grabbing; }
    .stream-floater-bar span { color: white; font-size: 0.78rem; pointer-events: none; }
    .stream-floater-btn { background: rgba(255,255,255,0.18); border: none; color: white; border-radius: 4px; cursor: pointer; padding: 1px 8px; font-size: 0.8rem; }

    /* ── Modals ── */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.52); z-index: 100; align-items: center; justify-content: center; cursor: pointer; }
    .modal.show { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; padding: 24px 26px; width: 370px; max-width: 92vw; max-height: 90dvh; overflow-y: auto; cursor: default; }
    body.dark .modal-box { background: #2b2d31; }
    .modal-box h2 { margin-bottom: 14px; font-size: 1.12rem; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 9px 11px; margin-bottom: 10px; border: 1px solid #e3e5e8; border-radius: 7px; background: inherit; color: inherit; font-size: 0.92rem; outline: none; }
    body.dark .modal-box input, body.dark .modal-box select, body.dark .modal-box textarea { border-color: #4a4d56; }
    .modal-box input:focus, .modal-box select:focus, .modal-box textarea:focus { border-color: #4f8ef7; }
    .modal-box button { width: 100%; padding: 9px; background: #4f8ef7; color: white; border: none; border-radius: 7px; cursor: pointer; font-size: 0.95rem; margin-top: 4px; transition: opacity 0.12s; }
    .modal-box button:hover { opacity: 0.86; }
    .modal-box .link-btn { background: none; color: #4f8ef7; font-size: 0.84rem; margin-top: 6px; }
    .modal-box .link-btn:hover { background: none; opacity: 0.75; }
    .modal-box .danger-btn { background: #ed4245; }
    .error-msg { color: #ed4245; font-size: 0.83rem; margin-bottom: 8px; }
    .success-msg { color: #3ba55c; font-size: 0.83rem; margin-bottom: 8px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 7px; border: 1px solid #e3e5e8; border-radius: 7px; background: none; color: inherit; cursor: pointer; font-size: 0.88rem; transition: all 0.12s; }
    body.dark .tab { border-color: #4a4d56; }
    .tab.active { background: #4f8ef7; color: white; border-color: #4f8ef7; }
    .tab:hover:not(.active) { background: rgba(79,142,247,0.1); }
    .sender:hover { opacity: 0.75; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      #topbar { display: none; }
      #mobile-topbar { display: flex; }
      #app { height: calc(100vh - 50px); height: calc(100dvh - 50px); }
      #sidebar {
        position: fixed; left: 0; top: 50px; bottom: 0; z-index: 50;
        transform: translateX(-100%); transition: transform 0.25s ease;
        width: 280px; min-width: 0; box-shadow: 2px 0 14px rgba(0,0,0,0.22);
      }
      #sidebar.mobile-open { transform: translateX(0); }
      #members-sidebar {
        position: fixed; right: 0; top: 50px; bottom: 0; z-index: 50;
        transform: translateX(100%); transition: transform 0.25s ease;
        width: 230px; min-width: 0; box-shadow: -2px 0 14px rgba(0,0,0,0.22);
      }
      #members-sidebar.mobile-open { transform: translateX(0); }
      #sidebar-overlay { display: none; position: fixed; inset: 0; top: 50px; background: rgba(0,0,0,0.48); z-index: 45; }
      #sidebar-overlay.show { display: block; }
      #msg-input { font-size: 16px; }
      #messages, #room-list, #member-list { -webkit-overflow-scrolling: touch; }
      .modal-box { width: 94vw; max-width: 94vw; padding: 18px 14px; }
    }
  </style>
</head>
<body>

<!-- ── 顶栏 ── -->
<div id="topbar">
  <img id="topbar-logo" src="/static/logo.svg" alt="Reco">
  <div id="topbar-spacer"></div>
  <div id="topbar-right">
    <div id="topbar-user-avatar" onclick="openProfile()"></div>
    <span id="topbar-name" onclick="openProfile()"></span>
    <button class="topbar-icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="切换主题">
      <svg width="17" height="17" viewBox="0 0 21 21" fill="none"><path d="M10.5 3.5V2M10.5 19v-1.5M3.5 10.5H2M19 10.5h-1.5M5.45 5.45 4.39 4.39M16.61 16.61l-1.06-1.06M5.45 15.55l-1.06 1.06M16.61 4.39l-1.06 1.06M14 10.5a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="topbar-icon-btn" onclick="openSettings()" title="设置">

<!-- ── 主体三栏布局 ── -->

      </div>
    </div>
    <div id="room-list"></div>
  </div>

  <!-- 中间：聊天区 -->
  <div id="chat-area">
    <div id="no-room">请先登录或注册</div>
    <div id="chat-main" style="display:none; flex:1; flex-direction:column; min-width:0; min-height:0; overflow:hidden;">
      <div id="chat-header">
        <button id="chat-title" onclick="openRoomCard()"></button>
      </div>
      <div id="stream-panel"><div id="stream-grid"></div></div>
      <div id="stream-resize-handle"></div>
      <div id="messages"></div>
      <div id="input-area">
        <input id="msg-input" type="text" placeholder="输入消息..." />
        <button id="send-btn" onclick="sendMessage()">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M4.114 9.875h11.521M15.635 9.875L9.875 4.115M15.635 9.875L9.875 15.635" stroke="white" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 右侧栏：语音 + 成员 -->
  <div id="members-sidebar">
    <div id="voice-section">
      <div id="voice-section-title">Voice Chat</div>
      <button id="voice-join-btn" onclick="joinVoice()">🎤 加入语音</button>
      <div id="voice-in-controls">
        <button id="mic-toggle" class="voice-icon-btn" onclick="toggleMute()" title="闭麦 / 开麦">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="speaker-toggle" class="voice-icon-btn" onclick="toggleSpeaker()" title="静音扬声器">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <button id="voice-leave-btn" onclick="leaveVoice()">📵 离开语音</button>
      </div>
      <!-- 音量控制（隐藏，进阶用） -->
      <div id="voice-vol-controls" style="display:none">
        <div class="voice-vol-row">
          <input type="range" id="mic-volume" min="0" max="100" value="100" oninput="setMicVolume(this.value)" />
          <span id="mic-vol-pct" style="font-size:0.78rem;min-width:30px;text-align:right;">100%</span>
        </div>
        <div class="voice-vol-row">
          <input type="range" id="speaker-volume" min="0" max="100" value="100" oninput="setSpeakerVolume(this.value)" />
          <span id="speaker-vol-pct" style="font-size:0.78rem;min-width:30px;text-align:right;">100%</span>
        </div>
      </div>
      <button id="stream-audio-btn" onclick="toggleStreamAudio()">🖥 共享音频</button>
      <button id="live-btn" onclick="toggleLive()">📺 直播</button>
      <div id="voice-members-list"></div>
    </div>
    <div id="members-divider"></div>
    <div id="sidebar-members-title">Members</div>
    <div id="member-list"></div>
  </div>

</div>

<!-- ── 登录/注册弹窗 ── -->
<div class="modal" id="auth-modal">
  <div class="modal-box">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">登录</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">注册</button>
    </div>

    <!-- 登录 -->
    <div id="login-form">
      <div class="error-msg" id="login-error"></div>
      <input id="login-username" type="text" placeholder="用户名" />
      <input id="login-password" type="password" placeholder="密码" />
      <button id="login-submit-btn" onclick="doLogin()">登录</button>
      <button id="forgot-pw-link" class="link-btn" onclick="openForgotPassword()">忘记密码？</button>
    </div>

    <!-- 注册 -->
    <div id="register-form" style="display:none">
      <div class="error-msg" id="register-error"></div>
      <input id="reg-username" type="text" placeholder="用户名（登录用，不可更改）" />
      <input id="reg-screenname" type="text" placeholder="显示名" />
      <input id="reg-password" type="password" placeholder="密码（至少6位）" />
      <textarea id="reg-bio" placeholder="个人简介（可选）" rows="2"></textarea>
      <select id="reg-question"><option value="">选择安全问题...</option></select>
      <input id="reg-answer" type="text" placeholder="安全问题答案" />
      <button id="register-submit-btn" onclick="doRegister()">注册</button>
    </div>
  </div>
</div>

<!-- ── 忘记密码弹窗 ── -->
<div class="modal" id="forgot-modal">

    <div id="forgot-step2" style="display:none">
      <p id="forgot-question" style="margin-bottom:12px; font-size:0.95rem;"></p>

      <input id="forgot-newpw" type="password" placeholder="新密码（至少6位）" />
      <button id="forgot-reset-btn" onclick="doResetPassword()">重置密码</button>

    <button id="forgot-back-btn" class="link-btn" onclick="closeForgot()">返回登录</button>
  </div>
</div>

<div class="modal" id="find-room-modal">
  <div class="modal-box">
    <h2 id="find-room-title">🔍 搜索房间</h2>
    <div class="error-msg" id="find-room-error"></div>
    <input id="find-room-code" type="text" placeholder="输入房间号（6位数字）" maxlength="6" style="letter-spacing:2px;" />
    <button id="find-room-confirm-btn" onclick="doFindRoom()">搜索</button>
    <button id="find-room-cancel-btn" class="link-btn" style="color:#e74c3c" onclick="closeModal('find-room-modal')">取消</button>
  </div>
</div>

<!-- ── 邀请选择房间弹窗 ── -->
<div class="modal" id="invite-room-modal">
  <div class="modal-box">
    <h2 id="invite-room-title">邀请到聊天室</h2>
    <p id="invite-target-name" style="color:#888; font-size:0.9rem; margin-bottom:12px;"></p>
    <div id="invite-room-list" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto;"></div>
    <button id="invite-room-cancel-btn" class="link-btn" style="color:#e74c3c; margin-top:12px;" onclick="closeModal('invite-room-modal')">取消</button>
  </div>
</div>

<!-- ── 邀请通知弹窗 ── -->
<div class="modal" id="invite-notify-modal">
  <div class="modal-box">
    <h2 id="invite-notify-title">📩 房间邀请</h2>
    <p id="invite-notify-text" style="margin-bottom:16px;"></p>
    <div style="display:flex; gap:10px;">
      <button id="invite-accept-btn" style="flex:1; background:#27ae60; color:white;" onclick="acceptInvite()">接受</button>
      <button id="invite-decline-btn" style="flex:1;" class="danger-btn" onclick="declineInvite()">拒绝</button>
    </div>
  </div>
</div>

<!-- ── 设置弹窗 ── -->
<div class="modal" id="settings-modal">
  <div class="modal-box" style="max-width:420px; width:90%;">
    <h2 id="settings-title">⚙️ 设置</h2>
    <div class="tabs" style="margin-bottom:16px;">
      <button class="tab active" id="settings-tab-general" onclick="switchSettingsTab('general')">通用</button>
      <button class="tab" id="settings-tab-audio" onclick="switchSettingsTab('audio')">🎵 音频</button>
    </div>
    <div id="settings-audio-panel" style="display:none;">
      <div style="margin-bottom:14px;">
        <label id="settings-mic-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:6px;">🎤 麦克风</label>
        <select id="mic-select" style="width:100%; padding:6px; border-radius:6px; border:1px solid #ddd;" onchange="saveMicDevice(this.value)"></select>
      </div>
      <div style="margin-bottom:14px;">
        <label id="settings-speaker-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:6px;">🔊 扬声器</label>
        <select id="speaker-select" style="width:100%; padding:6px; border-radius:6px; border:1px solid #ddd;" onchange="saveSpeakerDevice(this.value)"></select>
      </div>
      <div>
        <label id="settings-mic-test-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:8px;">🎚️ 麦克风测试</label>
        <div id="mic-test-bar" style="display:none; background:#eee; border-radius:4px; height:10px; margin-bottom:10px; overflow:hidden;">
          <div id="mic-test-level" style="height:100%; width:0%; background:#4f8ef7; transition:width 0.05s;"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="start-mic-test-btn" onclick="startMicTest()">▶ 开始测试</button>
          <button id="stop-mic-test-btn" style="display:none;" onclick="stopMicTest()">■ 停止</button>
        </div>
      </div>
    </div>
    <div id="settings-general-panel">
      <div>
        <label id="settings-lang-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:8px;">🌐 语言 / Language</label>
        <div style="display:flex; gap:8px;">
          <button class="tab active" id="lang-zh-btn" onclick="setLang('zh')">中文</button>
          <button class="tab" id="lang-en-btn" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <button id="settings-close-btn" class="link-btn" style="color:#e74c3c; margin-top:20px;" onclick="closeSettings()">关闭</button>
  </div>
</div>

<!-- ── 房间密码弹窗 ── -->
<div class="modal" id="room-pw-modal">
  <div class="modal-box">
    <h2 id="room-pw-modal-title">🔒 输入房间密码</h2>
    <div class="error-msg" id="room-pw-error"></div>
    <input id="room-pw-input" type="password" placeholder="密码" />
    <label id="room-pw-remember-label" style="display:flex; align-items:center; gap:8px; font-size:0.9rem; margin-bottom:12px; cursor:pointer;">
      <input type="checkbox" id="room-pw-remember" /> 记住密码
    </label>
    <button id="room-pw-enter-btn" onclick="submitRoomPassword()">进入</button>
    <button id="room-pw-cancel-btn" class="link-btn" style="color:#e74c3c" onclick="closeModal('room-pw-modal')">取消</button>
  </div>
</div>

<!-- ── 创建房间弹窗 ── -->

</div>

    'room-pw-modal-title','room-pw-enter-btn','room-pw-cancel-btn',
  ];
  textIds.forEach(id => { const el = document.getElementById(id); if (el && L[id]) el.textContent = L[id]; });
  // Placeholders
  const phMap = {
    'room-search':'ph-room-search','msg-input':'ph-msg-input',
    'login-username':'ph-login-username','login-password':'ph-login-password',
    'reg-username':'ph-reg-username','reg-screenname':'ph-reg-screenname',

    'find-room-code':'ph-find-room-code',
    'room-new-pw-input':'ph-room-new-pw-input','room-pw-input':'ph-room-pw-input',
  };
  Object.entries(phMap).forEach(([id, key]) => { const el = document.getElementById(id); if (el && L[key]) el.placeholder = L[key]; });
  // Titles
  const titleMap = { 'mic-toggle':'mic-title', 'speaker-toggle':'speaker-title' };
  Object.entries(titleMap).forEach(([id, key]) => { const el = document.getElementById(id); if (el && L[key]) el.title = L[key]; });
  if (currentRoom) _setChatTitle(currentRoom);
  updateVoiceCount();
  updateMembersCount();
  // Room pw remember label (has child checkbox, use lastChild)
  const remEl = document.getElementById('room-pw-remember-label');
  if (remEl) remEl.lastChild.textContent = ' ' + (L['room-pw-remember-label-text'] || '');
  // Dynamic state buttons
  const vjb = document.getElementById('voice-join-btn');
  if (vjb) vjb.textContent = t('voice-join');
  const vlb = document.getElementById('voice-leave-btn');
  if (vlb) vlb.textContent = t('voice-leave');
  const sab = document.getElementById('stream-audio-btn');
  if (sab) sab.textContent = isStreamingAudio ? t('stop-sharing') : t('share-audio');
  const lb = document.getElementById('live-btn');
  if (lb) lb.textContent = isStreaming ? t('stop-live') : t('live');
  // no-room hint (only if not kicked)
  const nr = document.getElementById('no-room');
  if (nr && !currentRoom) nr.textContent = t('no-room');
  // Language buttons active state
  document.getElementById('lang-zh-btn')?.classList.toggle('active', currentLang === 'zh');
  document.getElementById('lang-en-btn')?.classList.toggle('active', currentLang === 'en');
  // Re-populate security question select in correct language
  populateQuestionSelect();
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  applyLang();
}

function switchSettingsTab(tab) {
  document.getElementById('settings-tab-audio').classList.toggle('active', tab === 'audio');
  document.getElementById('settings-tab-general').classList.toggle('active', tab === 'general');
  document.getElementById('settings-audio-panel').style.display = tab === 'audio' ? '' : 'none';
  document.getElementById('settings-general-panel').style.display = tab === 'general' ? '' : 'none';
}

async function loadIceServers() {
  try {
    const u = currentUser ? encodeURIComponent(currentUser.username) : '';
    const r = await fetch('/api/ice-servers?u=' + u);
    const servers = await r.json();
    if (servers.length) iceServers = { iceServers: servers };
  } catch (e) {
    console.warn('Failed to fetch ICE servers, using STUN only', e);
  }
}

const savedUser = localStorage.getItem('currentUser');
if (savedUser) {
  currentUser = JSON.parse(savedUser);
  if (!currentUser.avatar_expression) currentUser.avatar_expression = 'Smile';
  if (!currentUser.avatar_color) currentUser.avatar_color = defaultAvatarColor(currentUser.username);
  userAvatarCache[currentUser.username] = { expression: currentUser.avatar_expression, color: currentUser.avatar_color };
  updateSidebarAvatar();
}

// 不支持 getDisplayMedia 的设备（如 iOS）隐藏直播/共享音频按钮
if (!navigator.mediaDevices?.getDisplayMedia) {
  document.getElementById('stream-audio-btn').style.display = 'none';
  document.getElementById('live-btn').style.display = 'none';
}

// 启动时获取房间列表
let _socketConnectedBefore = false;
socket.on('connect', function() {
  const isReconnect = _socketConnectedBefore;
  _socketConnectedBefore = true;
  if (currentUser) {
    socket.emit('get_rooms', { username: currentUser.username });
    socket.emit('get_dms', { username: currentUser.username });
    socket.emit('user_online', { username: currentUser.username });
    if (currentRoom) {
      const wasInVoice = inVoice;
      if (isReconnect && wasInVoice) {
        Object.values(peerConnections).forEach(pc => pc.close());
        peerConnections = {};
        Object.values(audioElements).forEach(audio => {
          try { audio.pause(); audio.srcObject = null; if (audio.parentNode) audio.parentNode.removeChild(audio); } catch(e) {}
        });
        audioElements = {};
        audioGains = {};
        if (isStreamingAudio) stopStreamAudio(true);
        if (isStreaming) stopStream(true);
        Object.values(streamAudioElements).forEach(a => { try { a.pause(); a.srcObject = null; a.remove(); } catch(e) {} });
        for (const u in streamAudioElements) delete streamAudioElements[u];
        Object.keys(streamVideos).forEach(u => removeStreamCard(u));
        document.querySelectorAll('.stream-vol-row').forEach(el => el.remove());
        document.querySelectorAll('.stream-indicator').forEach(el => el.remove());
        document.querySelectorAll('.stream-floater').forEach(el => el.remove());
      }
      if (currentIsDm) {
        socket.emit('join_dm', { username: currentUser.username, dm_room: currentRoom });
      } else {
        _submitJoin(currentRoom, savedRoomPasswords[currentRoom] || '', isReconnect);
        if (isReconnect && wasInVoice) {
          socket.emit('voice_join', { username: currentUser.username, screenname: currentUser.screenname, room: currentRoom });
        }
      }
    }
  }
});

socket.on('rooms_list', function(data) {
  data.rooms.forEach(r => {
    addRoomToList(r.name, r.has_password, r.code);
    // 订阅所有房间的消息流，这样后台消息会实时写入缓存
    if (currentUser) socket.emit('room_subscribe', { room: r.name });
  });
  if (currentUser && !currentRoom) joinRoom('大厅');
});

function renderMembers(members) {
  const list = document.getElementById('member-list');
  list.innerHTML = '';
  memberAdmins.clear();
  memberOwner = '';
  members.forEach(m => {
    if (m.is_admin) memberAdmins.add(m.username);
    if (m.is_owner) memberOwner = m.username;
    if (m.avatar_expression || m.avatar_color) {
      userAvatarCache[m.username] = { expression: m.avatar_expression || 'Smile', color: m.avatar_color || defaultAvatarColor(m.username) };
    }
    const div = document.createElement('div');
    div.className = 'member-item' + (m.is_online ? '' : ' offline');
    div.id = 'member-' + m.username;
    const av = getAvatarData(m.username);
    const badge = m.is_owner ? '👑' : (m.is_admin ? '🛡' : '');
    div.innerHTML = avatarHTML(av.expression, av.color, 26) +
      `<span class="member-name">${m.screenname}</span>` +
      (badge ? `<span class="member-badge">${badge}</span>` : '');
    div.onclick = () => openMemberCard(m.username);
    list.appendChild(div);
  });
  updateMembersCount();
}

socket.on('members_list', function(data) {
  if (data.room) memberCache[data.room] = data.members;
  if (data.room === currentRoom || !data.room) renderMembers(data.members);
});

socket.on('new_room_created', function(data) {
  addRoomToList(data.room, data.has_password);
});

socket.on('voice_members_view', function(data) {
  (data.banned || []).forEach(u => voiceBanned.add(u));
  data.members.forEach(m => addVoiceMember(m.username, m.screenname, m.avatar_expression, m.avatar_color));
});

socket.on('online_status_changed', function(data) {
  // patch all cached room member lists
  Object.values(memberCache).forEach(members => {
    const m = members.find(m => m.username === data.username);
    if (m) m.is_online = data.online;
  });
  // patch live DOM if visible
  const el = document.getElementById('member-' + data.username);
  if (el) el.classList.toggle('offline', !data.online);
});

// ── 设置 ─────────────────────────────────────────────────
let savedMicDeviceId = localStorage.getItem('micDeviceId') || '';
let savedSpeakerDeviceId = localStorage.getItem('speakerDeviceId') || '';
let micTestStream = null;
let micTestContext = null;
let micTestAnimFrame = null;

async function openSettings() {
  openModal('settings-modal');
  await populateAudioDevices();
}

function closeSettings() {
  stopMicTest();
  closeModal('settings-modal');
}

async function populateAudioDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    const speakers = devices.filter(d => d.kind === 'audiooutput');

    const micSel = document.getElementById('mic-select');
    micSel.innerHTML = '';
    if (!mics.length) {
      micSel.innerHTML = '<option>未检测到麦克风</option>';
    } else {
      mics.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || ('麦克风 ' + (i + 1));
        if (d.deviceId === savedMicDeviceId) opt.selected = true;
        micSel.appendChild(opt);
      });
    }

    const spkRow = document.getElementById('speaker-select')?.closest('div');
    const spkSel = document.getElementById('speaker-select');
    const supportsSink = typeof HTMLAudioElement.prototype.setSinkId === 'function';
    if (!supportsSink) {
      // 设备不支持扬声器切换（iOS等），直接隐藏整行
      if (spkRow) spkRow.style.display = 'none';
    } else {
      if (spkRow) spkRow.style.display = '';
      spkSel.innerHTML = '';
      if (!speakers.length) {
        spkSel.innerHTML = '<option>未检测到扬声器</option>';
        spkSel.disabled = true;
      } else {
        spkSel.disabled = false;
        speakers.forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || ('扬声器 ' + (i + 1));
          if (d.deviceId === savedSpeakerDeviceId) opt.selected = true;
          spkSel.appendChild(opt);
        });
      }
    }
  } catch(e) {
    console.warn('无法枚举音频设备:', e);
  }
}

function saveMicDevice(deviceId) {
  savedMicDeviceId = deviceId;
  localStorage.setItem('micDeviceId', deviceId);
}

function saveSpeakerDevice(deviceId) {
  savedSpeakerDeviceId = deviceId;
  localStorage.setItem('speakerDeviceId', deviceId);
  Object.values(audioElements).forEach(audio => {
    if (typeof audio.setSinkId === 'function') {
      audio.setSinkId(deviceId).catch(e => console.warn('setSinkId:', e));
    }
  });
}

async function startMicTest() {
  stopMicTest();
  try {
    if (savedMicDeviceId) {
      try {
        micTestStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: savedMicDeviceId } } });
      } catch(e) {
        micTestStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    } else {
      micTestStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    // 权限拿到后重新枚举（显示完整设备名）
    await populateAudioDevices();
    micTestContext = new AudioContext();
    const source = micTestContext.createMediaStreamSource(micTestStream);
    const analyser = micTestContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    document.getElementById('mic-test-bar').style.display = '';
    document.getElementById('stop-mic-test-btn').style.display = '';
    document.getElementById('start-mic-test-btn').style.display = 'none';

    const data = new Uint8Array(analyser.frequencyBinCount);
    function animate() {
      micTestAnimFrame = requestAnimationFrame(animate);
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      document.getElementById('mic-test-level').style.width = Math.min(avg * 3, 100) + '%';
    }
    animate();
  } catch(e) {
    alert('无法访问麦克风：' + e.message);
  }
}

function stopMicTest() {
  if (micTestAnimFrame) { cancelAnimationFrame(micTestAnimFrame); micTestAnimFrame = null; }
  if (micTestStream) { micTestStream.getTracks().forEach(t => t.stop()); micTestStream = null; }
  if (micTestContext) { micTestContext.close(); micTestContext = null; }
  const bar = document.getElementById('mic-test-bar');
  const stopBtn = document.getElementById('stop-mic-test-btn');
  const startBtn = document.getElementById('start-mic-test-btn');
  if (bar) bar.style.display = 'none';
  if (stopBtn) stopBtn.style.display = 'none';
  if (startBtn) startBtn.style.display = '';
  const lvl = document.getElementById('mic-test-level');
  if (lvl) lvl.style.width = '0%';
}

const roomCodes    = {};
const roomMessages = {};   // { roomName: [msgData, ...] }  max 100
const roomLastTs   = {};   // { roomName: ISO timestamp }
const memberCache  = {};   // { roomName: [memberObj, ...] }
function addRoomToList(room, hasPassword, code) {

function joinRoom(room) {
  if (!currentUser) { openAuth(); return; }
  // 从 DM 切回普通房间时，恢复语音和成员区域
  currentIsDm = false;
  document.getElementById('voice-section').style.display = '';
  document.getElementById('members-divider').style.display = '';
  document.getElementById('sidebar-members-title').style.display = '';
  const titleEl = document.getElementById('chat-title');
  if (titleEl) titleEl.onclick = openRoomCard;
  pendingJoinRoom = room;
  if (roomHasPassword[room]) {
    const saved = savedRoomPasswords[room];
    if (saved) { _submitJoin(room, saved); return; }
    document.getElementById('room-pw-error').textContent = '';
    document.getElementById('room-pw-input').value = '';
    document.getElementById('room-pw-remember').checked = false;
    openModal('room-pw-modal');
    return;
  }
  _submitJoin(room, '');
}

function _submitJoin(room, password, isReconnect = false) {
  currentRoom = room;
  document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('room-' + room);
  if (el) el.classList.add('active');
  _setChatTitle(room);
  const mt = document.getElementById('mobile-room-title');
  if (mt) mt.textContent = '# ' + room;
  document.getElementById('no-room').style.display = 'none';
  document.getElementById('chat-main').style.display = 'flex';
  document.getElementById('chat-main').style.flexDirection = 'column';
  closeAllSidebars();

  if (isReconnect) {
    // 断线重连：保留当前消息，只让服务端重注册 socket 房间 + 更新成员列表
    socket.emit('join', { username: currentUser.username, screenname: currentUser.screenname, room, password, skip_history: true });
  } else {
    // 主动切换房间：立即显示缓存，再向服务端请求增量消息
    document.getElementById('messages').innerHTML = '';
    document.getElementById('voice-members-list').innerHTML = '';
    voiceBanned.clear();
    (roomMessages[room] || []).forEach(msg => appendMessage(msg, false));
    if (memberCache[room]) renderMembers(memberCache[room]);
    else document.getElementById('member-list').innerHTML = '';
    const since = roomLastTs[room] || null;
    socket.emit('join', { username: currentUser.username, screenname: currentUser.screenname, room, password, since });
  }
}

function submitRoomPassword() {
  const pw = document.getElementById('room-pw-input').value;
  if (!pw) return;
  if (document.getElementById('room-pw-remember').checked) {
    savedRoomPasswords[pendingJoinRoom] = pw;
    localStorage.setItem('roomPasswords', JSON.stringify(savedRoomPasswords));
  }
  closeModal('room-pw-modal');
  _submitJoin(pendingJoinRoom, pw);
}

socket.on('join_result', function(data) {
  if (!data.success) {
    document.getElementById('chat-main').style.display = 'none';
    document.getElementById('no-room').style.display = 'flex';
    document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
    if (currentRoom) {
      const prev = document.getElementById('room-' + currentRoom);
      if (prev) prev.classList.add('active');
    }
    currentRoom = null;
    if (data.wrong_password) {
      delete savedRoomPasswords[pendingJoinRoom];
      localStorage.setItem('roomPasswords', JSON.stringify(savedRoomPasswords));
      document.getElementById('room-pw-error').textContent = data.msg;
      document.getElementById('room-pw-input').value = '';
      openModal('room-pw-modal');
    } else {
      alert(data.msg);
    }
    return;
  }
  isMod = data.is_admin || false;
  isOwner = data.is_owner || false;
  isAdmin = isMod || isOwner || (currentUser?.username === 'admin');
  if (data.code && data.room) roomCodes[data.room] = data.code;
  _setChatTitle(currentRoom);
  if (data.members && data.room) {
    memberCache[data.room] = data.members;
    renderMembers(data.members);
  }
});

// ── 消息 ──────────────────────────────────────────────────
function appendMessage(data, cache = true) {
  const msgRoom = data.room || currentRoom;

  // 写缓存（系统消息不缓存，避免重复显示）
  if (cache && msgRoom && !data.system) {
    if (!roomMessages[msgRoom]) roomMessages[msgRoom] = [];
    roomMessages[msgRoom].push(data);
    if (roomMessages[msgRoom].length > 100) roomMessages[msgRoom].shift();
    if (data.time) roomLastTs[msgRoom] = data.time;
  }

  // 非当前房间的消息只缓存，不渲染
  if (msgRoom !== currentRoom) return;

  const div = document.getElementById('messages');
  const msg = document.createElement('div');

  if (data.system) {
    msg.className = 'msg system';
    const t = document.createElement('span');
    t.className = 'msg-sys-text';
    t.textContent = data.text;
    msg.appendChild(t);
  } else {
    // 时间戳分隔线
    const lastSep = div.dataset.lastSepTime;
    const tsLabel = formatMsgTime(data.time);
    if (tsLabel && tsLabel !== lastSep) {
      const sep = document.createElement('div');
      sep.className = 'msg-separator';
      sep.textContent = tsLabel;
      div.appendChild(sep);
      div.dataset.lastSepTime = tsLabel;
    }

    const isOwn = currentUser && data.username === currentUser.username;
    msg.className = 'msg' + (isOwn ? ' own' : '');
    const av = getAvatarData(data.username);

    const avDiv = document.createElement('div');
    avDiv.className = 'msg-av';
    avDiv.innerHTML = avatarHTML(av.expression, av.color, 32);
    avDiv.style.cursor = 'pointer';
    avDiv.onclick = () => openMemberCard(data.username);
    msg.appendChild(avDiv);

    const body = document.createElement('div');
    body.className = 'msg-body';
    if (!isOwn) {
      const name = document.createElement('span');
      name.className = 'msg-name';
      name.style.color = av.color;
      name.textContent = data.screenname;
      name.onclick = () => openMemberCard(data.username);
      body.appendChild(name);
    }
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = data.text;
    bubble.appendChild(text);
    body.appendChild(bubble);
    msg.appendChild(body);
  }

  div.appendChild(msg);
  div.scrollTop = div.scrollHeight;
}

socket.on('message', function(data) {
  appendMessage(data);
  if (data.system && data.room === currentRoom) {
    socket.emit('get_members', { room: currentRoom });
  }
});

function formatMsgTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return ts;
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

async function toggleVoice() {
  if (!currentUser) { openAuth(); return; }
  if (!currentRoom) { alert('请先进入房间'); return; }
  
  if (!inVoice) {
    await joinVoice();
  } else {
    leaveVoice();
  }
}

async function joinVoice() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('语音功能需要 HTTPS 连接，直接用 IP 地址访问时不可用。\n请通过 https:// 地址访问本站。');
    return;
  }
  await loadIceServers();
  try {
    let localRaw;
    if (savedMicDeviceId) {
      try {
        localRaw = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: savedMicDeviceId } } });
      } catch(e) {
        // 保存的设备 ID 在此设备上不存在（跨设备/手机），回退到默认麦克风
        localRaw = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    } else {
      localRaw = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    localStream = localRaw;

    // 发送侧：与原来一致，通过 AudioContext 处理后发出
    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(localStream);
    const gainNode = audioContext.createGain();
    micGainNode = gainNode;
    const dest = audioContext.createMediaStreamDestination();
    source.connect(gainNode);
    gainNode.connect(dest);
    localStream = dest.stream;

    // 说话检测
    const analyser = audioContext.createAnalyser();
    source.connect(analyser);
    detectSpeaking(analyser);
    
    inVoice = true;
    document.getElementById('voice-join-btn').style.display = 'none';
    document.getElementById('voice-in-controls').classList.add('show');
    document.getElementById('voice-vol-controls').style.display = '';
    document.getElementById('stream-audio-btn').classList.add('show-ctrl');
    document.getElementById('live-btn').classList.add('show-ctrl');

    // iOS Safari 切后台时可能强制停止麦克风轨道，检测到后更新UI提示重连
    dest.stream.getTracks().forEach(track => {
      track.onended = () => {
        if (inVoice) {
          leaveVoice();
          const vs2 = document.getElementById('voice-status');
          vs2.innerHTML = '⚠️ 语音已断开 <button onclick="toggleVoice()" style="font-size:0.75rem;padding:2px 8px;margin-left:4px;background:#4f8ef7;color:white;border:none;border-radius:4px;cursor:pointer;">重新加入</button>';
          vs2.style.display = '';
        }
      };
    });

    const myAv = getAvatarData(currentUser.username);
    addVoiceMember(currentUser.username, currentUser.screenname, myAv.expression, myAv.color);
    socket.emit('voice_join', { username: currentUser.username, screenname: currentUser.screenname, room: currentRoom, avatar_expression: myAv.expression, avatar_color: myAv.color });
  } catch (e) {
    alert('无法访问麦克风：' + e.message);
  }
}

function leaveVoice() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  Object.values(peerConnections).forEach(pc => pc.close());
  peerConnections = {};
  Object.values(audioElements).forEach(audio => { try { audio.pause(); audio.srcObject = null; if (audio.parentNode) audio.parentNode.removeChild(audio); } catch(e) {} });
  audioElements = {};
  Object.values(audioGains).forEach(g => { try { g.disconnect(); } catch(e) {} });
  audioGains = {};
  if (audioContext) { audioContext.close(); audioContext = null; }
  if (isStreamingAudio) stopStreamAudio(true);
  if (isStreaming) stopStream(true);
  Object.values(streamAudioElements).forEach(a => { try { a.pause(); a.srcObject = null; a.remove(); } catch(e) {} });
  for (const u in streamAudioElements) delete streamAudioElements[u];
  Object.keys(streamVideos).forEach(u => removeStreamCard(u));
  document.querySelectorAll('.stream-vol-row').forEach(el => el.remove());
  document.querySelectorAll('.stream-indicator').forEach(el => el.remove());
  document.querySelectorAll('.stream-floater').forEach(el => el.remove());

  inVoice = false;
  isMuted = false;
  isSpeakerMuted = false;
  document.getElementById('voice-join-btn').style.display = '';
  document.getElementById('voice-in-controls').classList.remove('show');
  document.getElementById('voice-vol-controls').style.display = 'none';
  document.getElementById('stream-audio-btn').classList.remove('show-ctrl');
  document.getElementById('live-btn').classList.remove('show-ctrl');
  document.getElementById('mic-toggle').classList.remove('muted');
  document.getElementById('speaker-toggle').classList.remove('muted');
  
  socket.emit('voice_leave', { username: currentUser.username, room: currentRoom });
}

// ── 语音：WebRTC 连接 ─────────────────────────────────────
async function createPeerConnection(targetUsername) {
  const pc = new RTCPeerConnection(iceServers);
  peerConnections[targetUsername] = pc;
  
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    if (event.track.kind === 'video') {
      if (!streamVideos[targetUsername]) {
        const video = document.createElement('video');
        video.autoplay = true;
        video.setAttribute('playsinline', '');
        video.muted = true;
        video.srcObject = new MediaStream([event.track]);
        streamVideos[targetUsername] = video;
        addStreamCard(targetUsername, voiceScreennames[targetUsername] || targetUsername);
        event.track.onended = () => removeStreamCard(targetUsername);
      }
      return;
    }

    if (!audioElements[targetUsername]) {
      // 第一条音轨 = 麦克风
      const audio = document.createElement('audio');
      audio.autoplay = true;
      audio.setAttribute('playsinline', '');
      audio.srcObject = new MediaStream([event.track]);
      document.body.appendChild(audio);
      if (savedSpeakerDeviceId && typeof audio.setSinkId === 'function') {
        audio.setSinkId(savedSpeakerDeviceId).catch(() => {});
      }
      if (isSpeakerMuted) audio.muted = true;
      audio.volume = Math.min(speakerVolume, 1);
      audio.play().catch(e => console.warn('audio play blocked:', e));
      audioElements[targetUsername] = audio;
      audioGains[targetUsername] = audio;

    } else if (!streamAudioElements[targetUsername]) {
      // 第二条音轨 = 对方共享的音频
      const audio = document.createElement('audio');
      audio.autoplay = true;
      audio.setAttribute('playsinline', '');
      audio.srcObject = new MediaStream([event.track]);
      document.body.appendChild(audio);
      if (isSpeakerMuted) audio.muted = true;
      audio.volume = 0.8;
      audio.play().catch(() => {});
      streamAudioElements[targetUsername] = audio;
      showStreamVolControl(targetUsername);
      event.track.onended = () => hideStreamVolControl(targetUsername);

    }
  };

  let _iceRetries = 0;
  const ICE_MAX_RETRIES = 5;
  pc.oniceconnectionstatechange = () => {
    const el = document.getElementById('vm-' + targetUsername);
    const state = pc.iceConnectionState;
    if (state === 'connected' || state === 'completed') {
      if (el) { el.style.opacity = ''; el.title = ''; }
      _iceRetries = 0;
    } else if (state === 'disconnected') {
      if (el) { el.style.opacity = '0.5'; el.title = '连接中断，等待恢复…'; }
    } else if (state === 'failed') {
      if (_iceRetries < ICE_MAX_RETRIES) {
        _iceRetries++;
        if (el) { el.style.opacity = '0.4'; el.title = `重连中… (${_iceRetries}/${ICE_MAX_RETRIES})`; }
        try { pc.restartIce(); } catch(e) {}
      } else {
        if (el) { el.style.opacity = '0.2'; el.title = '连接失败'; }
        const sn = voiceScreennames[targetUsername] || targetUsername;
        const vs = document.getElementById('voice-status');
        if (vs) { vs.textContent = `⚠ 与 ${sn} 的语音连接失败`; vs.style.display = ''; vs.style.color = '#e74c3c'; }
      }
    }
  };

  pc.onnegotiationneeded = async () => {
    // Only renegotiate if we have more live senders than already-negotiated send m-lines.
    // This prevents spurious renegotiation on the answering side (whose onnegotiationneeded
    // fires after the initial handshake even though no new tracks were added).
    const activeSenders = pc.getSenders().filter(s => s.track?.readyState === 'live').length;
    const localSdp = pc.localDescription?.sdp || '';
    const sendMlines = (localSdp.match(/a=(sendrecv|sendonly)/gm) || []).length;
    if (pc.localDescription && activeSenders <= sendMlines) return;
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('voice_offer', { room: currentRoom, from: currentUser.username, to: targetUsername, offer });
    } catch(e) { console.warn('renegotiation failed:', e); }
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('voice_ice', {
        room: currentRoom,
        from: currentUser.username,
        to: targetUsername,
        candidate: event.candidate
      });
    }
  };
  
  return pc;
}

// ── 语音：信令处理 ────────────────────────────────────────
socket.on('voice_current_members', async function(data) {
  for (const member of data.members) {
    if (member.username !== currentUser.username && !peerConnections[member.username]) {
      addVoiceMember(member.username, member.screenname);
      const pc = await createPeerConnection(member.username);
      // Include any live stream tracks in the initial offer so late joiners
      // receive the stream without needing a separate renegotiation round.
      if (displayStream) {
        displayStream.getTracks().filter(t => t.readyState === 'live').forEach(t => {
          try { pc.addTrack(t, displayStream); } catch(e) {}
        });
      } else if (isStreamingAudio && streamAudioTrack?.readyState === 'live') {
        try { pc.addTrack(streamAudioTrack, new MediaStream([streamAudioTrack])); } catch(e) {}
      }
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('voice_offer', {
        room: currentRoom,
        from: currentUser.username,
        to: member.username,
        offer: offer
      });
    }
  }
});

socket.on('voice_user_joined', async function(data) {
  if (data.username === currentUser?.username) return;
  addVoiceMember(data.username, data.screenname, data.avatar_expression, data.avatar_color);
});

socket.on('voice_offer', async function(data) {
  if (data.to !== currentUser?.username || !inVoice) return;
  // 如果已有未关闭的连接，直接复用（重协商），不新建
  let pc = peerConnections[data.from];
  if (!pc || pc.signalingState === 'closed') {
    pc = await createPeerConnection(data.from);
  }
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('voice_answer', {
    room: currentRoom,
    from: currentUser.username,
    to: data.from,
    answer: answer
  });
  // After answer, signaling state returns to 'stable' — safe to add stream tracks now.
  // This lets late joiners receive ongoing streams via renegotiation.
  if (displayStream) {
    displayStream.getTracks().filter(t => t.readyState === 'live').forEach(t => {
      const alreadySending = pc.getSenders().find(s => s.track === t);
      if (!alreadySending) try { pc.addTrack(t, displayStream); } catch(e) {}
    });
  } else if (isStreamingAudio && streamAudioTrack?.readyState === 'live') {
    const alreadySending = pc.getSenders().find(s => s.track === streamAudioTrack);
    if (!alreadySending) try { pc.addTrack(streamAudioTrack, new MediaStream([streamAudioTrack])); } catch(e) {}
  }
});

socket.on('voice_answer', async function(data) {
  if (data.to !== currentUser?.username) return;
  const pc = peerConnections[data.from];
  if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
});

socket.on('voice_ice', async function(data) {
  if (data.to !== currentUser?.username) return;
  const pc = peerConnections[data.from];
  if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
});

socket.on('voice_user_left', function(data) {
  removeVoiceMember(data.username);
  if (peerConnections[data.username]) {
    peerConnections[data.username].close();
    delete peerConnections[data.username];
  }
  if (audioElements[data.username]) {
    try { const a = audioElements[data.username]; a.pause(); a.srcObject = null; if (a.parentNode) a.parentNode.removeChild(a); } catch(e) {}
    delete audioElements[data.username];
  }
});

  if (!currentUser || username === currentUser.username) return false;

function addVoiceMember(username, screenname, avatarExpression, avatarColor) {

        ? `<button class="voice-btn" style="font-size:0.7rem;" onclick="unbanVoice('${username}')">解除禁言</button>`
        : `<button class="voice-btn" style="font-size:0.7rem;" onclick="banVoice('${username}')">禁言</button>`)
    : '';

// ── 语音：说话检测 ────────────────────────────────────────
function detectSpeaking(analyser) {
  const data = new Uint8Array(analyser.frequencyBinCount);
  let speaking = false;
  
  setInterval(() => {
    analyser.getByteFrequencyData(data);
    const avg = data.reduce((a, b) => a + b) / data.length;
    const nowSpeaking = avg > 10;
    
    if (nowSpeaking !== speaking) {
      speaking = nowSpeaking;
      socket.emit('voice_speaking', {
        room: currentRoom,
        username: currentUser.username,
        speaking: speaking
      });
      const el = document.getElementById('vm-' + currentUser.username);
      if (el) el.classList.toggle('speaking', speaking);
    }
  }, 100);
}

socket.on('voice_speaking', function(data) {
  const el = document.getElementById('vm-' + data.username);
  if (el) el.classList.toggle('speaking', data.speaking);
});

// ── 语音：音量控制 ────────────────────────────────────────
function setMicVolume(val) {
  if (micGainNode) micGainNode.gain.value = val / 100;
  const pct = document.getElementById('mic-vol-pct');
  if (pct) pct.textContent = val + '%';

function setSpeakerVolume(val) {
  speakerVolume = val / 100;
  for (const [u, a] of Object.entries(audioElements)) {
    if (a && !ignoredUsers.has(u)) a.volume = speakerVolume;
  }
  const pct = document.getElementById('speaker-vol-pct');
  if (pct) pct.textContent = val + '%';

function toggleStreamAudio() {

  else startStreamAudio();

async function startStreamAudio() {
  try {
    displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch(e) {
    if (e.name !== 'NotAllowedError') alert('无法捕获音频：' + e.message);
    return;
  }
  const audioTracks = displayStream.getAudioTracks();
  if (!audioTracks.length) {
    displayStream.getTracks().forEach(t => t.stop());
    displayStream = null;
    alert('未检测到共享音频。\n选择窗口/屏幕时，请勾选"分享音频"或"共享系统音频"。');
    return;
  }
  displayStream.getVideoTracks().forEach(t => t.stop());
  streamAudioTrack = audioTracks[0];
  isStreamingAudio = true;
  const btn = document.getElementById('stream-audio-btn');
  btn.textContent = t('stop-sharing');
  btn.classList.add('active');
  for (const [, pc] of Object.entries(peerConnections)) {
    try { pc.addTrack(streamAudioTrack, displayStream); } catch(e) {}
  }
  socket.emit('stream_audio_start', { room: currentRoom, username: currentUser.username });
  streamAudioTrack.onended = () => stopStreamAudio(false);
}

function stopStreamAudio(silent) {
  if (!isStreamingAudio) return;
  for (const [, pc] of Object.entries(peerConnections)) {
    const sender = pc.getSenders().find(s => s.track === streamAudioTrack);
    if (sender) try { pc.removeTrack(sender); } catch(e) {}
  }
  if (streamAudioTrack) { try { streamAudioTrack.stop(); } catch(e) {} streamAudioTrack = null; }
  if (displayStream) { displayStream.getTracks().forEach(t => { try { t.stop(); } catch(e) {} }); displayStream = null; }
  isStreamingAudio = false;
  const btn = document.getElementById('stream-audio-btn');
  if (btn) { btn.textContent = t('share-audio'); btn.classList.remove('active'); }
  if (!silent) socket.emit('stream_audio_stop', { room: currentRoom, username: currentUser.username });
}

// ── 语音：直播（视频+音频）────────────────────────────────
function toggleLive() {
  if (isStreaming) stopStream(false);
  else startStream();
}

async function startStream() {
  if (isStreamingAudio) stopStreamAudio(false);
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch(e) {
    if (e.name !== 'NotAllowedError') alert('无法捕获屏幕：' + e.message);
    return;
  }
  displayStream = stream;
  streamAudioTrack = stream.getAudioTracks()[0] || null;
  const videoTrack = stream.getVideoTracks()[0];
  if (!videoTrack) {
    stream.getTracks().forEach(t => t.stop());
    displayStream = null;
    alert('未获取到视频轨道。');
    return;
  }
  isStreaming = true;
  if (streamAudioTrack) isStreamingAudio = true;
  document.getElementById('live-btn').textContent = t('stop-live');
  document.getElementById('live-btn').classList.add('active');
  for (const [, pc] of Object.entries(peerConnections)) {
    try { pc.addTrack(videoTrack, stream); } catch(e) {}
    if (streamAudioTrack) try { pc.addTrack(streamAudioTrack, stream); } catch(e) {}
  }
  socket.emit('stream_start', { room: currentRoom, username: currentUser.username, screenname: currentUser.screenname });
  videoTrack.onended = () => stopStream(false);
}

function stopStream(silent) {
  if (!isStreaming) return;
  for (const [, pc] of Object.entries(peerConnections)) {
    pc.getSenders().forEach(sender => {
      if (displayStream && sender.track && displayStream.getTracks().includes(sender.track)) {
        try { pc.removeTrack(sender); } catch(e) {}
      }
    });
  }
  if (displayStream) { displayStream.getTracks().forEach(t => { try { t.stop(); } catch(e) {} }); displayStream = null; }
  streamAudioTrack = null;
  isStreaming = false;
  isStreamingAudio = false;
  const btn = document.getElementById('live-btn');
  if (btn) { btn.textContent = t('live'); btn.classList.remove('active'); }
  if (!silent) socket.emit('stream_stop', { room: currentRoom, username: currentUser.username });
}

function fullscreenStream(username) {
  const floater = document.getElementById('stream-float-' + username);
  const card = document.getElementById('stream-card-' + username);
  const video = (floater || card)?.querySelector('video');
  if (!video) return;
  // webkitEnterFullscreen 是 iOS Safari 上视频全屏的正确方法
  if (video.requestFullscreen) video.requestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
  else if (video.mozRequestFullScreen) video.mozRequestFullScreen();
}

function makeDraggable(el, handle) {
  handle = handle || el;
  let sx, sy, sl, st;

  function startDrag(cx, cy) {
    sx = cx; sy = cy;
    sl = el.offsetLeft; st = el.offsetTop;
    el.style.right = 'auto'; el.style.bottom = 'auto';
  }
  function applyDrag(cx, cy) {
    el.style.left = Math.max(0, sl + cx - sx) + 'px';
    el.style.top  = Math.max(0, st + cy - sy) + 'px';
  }

  handle.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    startDrag(e.clientX, e.clientY);
    const onMove = e2 => applyDrag(e2.clientX, e2.clientY);
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });

  handle.addEventListener('touchstart', e => {
    if (e.target.tagName === 'BUTTON') return;
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY);
    const onMove = e2 => { e2.preventDefault(); const t2 = e2.touches[0]; applyDrag(t2.clientX, t2.clientY); };
    const onEnd = () => { handle.removeEventListener('touchmove', onMove); handle.removeEventListener('touchend', onEnd); };
    handle.addEventListener('touchmove', onMove, { passive: false });
    handle.addEventListener('touchend', onEnd);
    e.preventDefault();
  }, { passive: false });
}

// 直播面板拖拽缩放
(function() {
  const handle = document.getElementById('stream-resize-handle');
  let dragging = false, startY = 0, startH = 0;

  function startResize(y) {
    dragging = true; startY = y;
    startH = document.getElementById('stream-panel').offsetHeight;
    handle.classList.add('dragging');
  }
  function applyResize(y) {
    if (!dragging) return;
    const newH = Math.max(90, Math.min(window.innerHeight * 0.72, startH + y - startY));
    document.getElementById('stream-panel').style.height = newH + 'px';
  }
  function endResize() { if (dragging) { dragging = false; handle.classList.remove('dragging'); } }

  handle.addEventListener('mousedown', e => { startResize(e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e => applyResize(e.clientY));
  document.addEventListener('mouseup', endResize);

  handle.addEventListener('touchstart', e => { startResize(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  handle.addEventListener('touchmove', e => { e.preventDefault(); applyResize(e.touches[0].clientY); }, { passive: false });
  handle.addEventListener('touchend', endResize);
})();

// ── 手机边缘滑动手势 ──────────────────────────────────────
(function() {
  const EDGE = 28;       // 触发区域宽度 px（距屏幕边缘）
  const MIN_SWIPE = 55;  // 最小滑动距离 px
  const MAX_VERT = 60;   // 最大允许垂直偏移 px（防止误触滚动）
  let t0x = 0, t0y = 0;

  document.addEventListener('touchstart', e => {
    t0x = e.touches[0].clientX;
    t0y = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    // 有弹窗打开时不触发
    if (document.querySelector('.modal.show')) return;
    const dx = e.changedTouches[0].clientX - t0x;
    const dy = e.changedTouches[0].clientY - t0y;
    if (Math.abs(dy) > MAX_VERT) return;  // 竖向滑动，跳过

    const W = window.innerWidth;
    if (t0x <= EDGE && dx >= MIN_SWIPE) {
      // 左边缘右滑 → 打开聊天室列表
      const sidebar = document.getElementById('sidebar');
      if (!sidebar.classList.contains('mobile-open')) toggleSidebar();
    } else if (t0x >= W - EDGE && dx <= -MIN_SWIPE) {
      // 右边缘左滑 → 打开成员列表
      const membersBar = document.getElementById('members-sidebar');
      if (!membersBar.classList.contains('mobile-open')) toggleMembersBar();
    }
  }, { passive: true });
})();

function defaultAvatarColor(username) {
  let h = 0;
  for (const c of (username || '')) h = (h * 31 + c.charCodeAt(0)) & 0x7fffffff;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function getAvatarData(username) {
  return userAvatarCache[username] || { expression: 'Smile', color: defaultAvatarColor(username) };
}

function avatarHTML(expression, color, size) {
  size = size || 32;
  const baseSvg = AVATAR_SVGS[expression] || AVATAR_SVGS.Smile;
  const svgW = Math.round(size * 0.62);
  const svgH = Math.round(svgW * 15 / 14);
  const svg = baseSvg
    .replace(/width="\d+"/, `width="${svgW}"`)
    .replace(/height="\d+"/, `height="${svgH}"`);
  return `<div class="av" style="width:${size}px;height:${size}px;background:${color || '#5865F2'}">${svg}</div>`;
}

  const logoutBtn = document.getElementById('logout-btn');
  const loginBtn = document.getElementById('login-open-btn');
  if (!wrap) return;
  const mobileLoginBtn = document.getElementById('mobile-login-btn');
  if (!currentUser) {
    wrap.innerHTML = ''; wrap.style.display = 'none';
    if (nameEl) { nameEl.textContent = ''; nameEl.style.display = 'none'; }
    if (logoutBtn) logoutBtn.style.display = 'none';
    if (loginBtn) loginBtn.style.display = '';
    if (mobileLoginBtn) mobileLoginBtn.style.display = '';
    return;
  }
  const av = getAvatarData(currentUser.username);
  wrap.innerHTML = avatarHTML(av.expression, av.color, 30);
  wrap.style.display = 'flex';
  if (nameEl) { nameEl.textContent = currentUser.screenname; nameEl.style.display = 'inline'; }
  if (logoutBtn) logoutBtn.style.display = 'flex';
  if (loginBtn) loginBtn.style.display = 'none';
  if (mobileLoginBtn) mobileLoginBtn.style.display = 'none';
}
