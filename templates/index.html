<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reco</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/app-logo.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4f8ef7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reco">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<!-- ── 顶栏 ── -->
<div id="topbar">
  <img id="topbar-logo" src="/static/logo.svg" alt="Reco">
  <div id="topbar-spacer"></div>
  <div id="topbar-right">
    <div id="topbar-user-avatar" onclick="openProfile()"></div>
    <span id="topbar-name" onclick="openProfile()"></span>
    <button class="topbar-icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="切换主题">
      <svg width="17" height="17" viewBox="0 0 21 21" fill="none"><path d="M10.5 3.5V2M10.5 19v-1.5M3.5 10.5H2M19 10.5h-1.5M5.45 5.45 4.39 4.39M16.61 16.61l-1.06-1.06M5.45 15.55l-1.06 1.06M16.61 4.39l-1.06 1.06M14 10.5a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="topbar-icon-btn" onclick="openSettings()" title="设置">
      <svg width="17" height="17" viewBox="0 0 21 21" fill="none"><path d="M10.5 13.125C11.9497 13.125 13.125 11.9497 13.125 10.5C13.125 9.05025 11.9497 7.875 10.5 7.875C9.05025 7.875 7.875 9.05025 7.875 10.5C7.875 11.9497 9.05025 13.125 10.5 13.125Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.975 13.125C16.8585 13.3889 16.8238 13.6817 16.8752 13.9655C16.9267 14.2494 17.062 14.5113 17.2637 14.7175L17.3163 14.77C17.479 14.9325 17.608 15.1255 17.6961 15.338C17.7842 15.5504 17.8295 15.7781 17.8295 16.0081C17.8295 16.2381 17.7842 16.4658 17.6961 16.6783C17.608 16.8907 17.479 17.0837 17.3163 17.2462C17.1537 17.409 16.9607 17.538 16.7483 17.6261C16.5358 17.7142 16.3081 17.7595 16.0781 17.7595C15.8481 17.7595 15.6204 17.7142 15.408 17.6261C15.1955 17.538 15.0025 17.409 14.84 17.2462L14.7875 17.1937C14.5813 16.992 14.3194 16.8567 14.0355 16.8052C13.7517 16.7538 13.4589 16.7885 13.195 16.905C12.9362 17.0159 12.7155 17.2001 12.56 17.4348C12.4046 17.6696 12.3211 17.9447 12.32 18.2262V18.375C12.32 18.8391 12.1356 19.2842 11.8074 19.6124C11.4792 19.9406 11.0341 20.125 10.57 20.125C10.1059 20.125 9.66075 19.9406 9.33256 19.6124C9.00437 19.2842 8.82 18.8391 8.82 18.375V18.2962C8.81323 18.0066 8.71948 17.7257 8.55095 17.4901C8.38241 17.2545 8.14689 17.075 7.875 16.975C7.61109 16.8585 7.31833 16.8238 7.03449 16.8752C6.75064 16.9267 6.48872 17.062 6.2825 17.2637L6.23 17.3163C6.06747 17.479 5.87447 17.608 5.66202 17.6961C5.44957 17.7842 5.22185 17.8295 4.99187 17.8295C4.7619 17.8295 4.53418 17.7842 4.32173 17.6961C4.10928 17.608 3.91628 17.479 3.75375 17.3163C3.59104 17.1537 3.46196 16.9607 3.3739 16.7483C3.28583 16.5358 3.2405 16.3081 3.2405 16.0781C3.2405 15.8481 3.28583 15.6204 3.3739 15.408C3.46196 15.1955 3.59104 15.0025 3.75375 14.84L3.80625 14.7875C4.00797 14.5813 4.14329 14.3194 4.19475 14.0355C4.24622 13.7517 4.21148 13.4589 4.095 13.195C3.98408 12.9362 3.79991 12.7155 3.56516 12.56C3.3304 12.4046 3.05531 12.3211 2.7737 .125 10.0359 20.125 10.5C20.125 10.9641 19.9406 11.4092 19.6124 11.7374C19.2842 12.0656 18.8391 12.25 18.375 12.25H18.2962C18.0147 12.2511 17.7396 12.3346 17.5048 12.49C17.2701 12.6455 17.0859 12.8662 16.975 13.125Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="topbar-icon-btn" id="logout-btn" onclick="logout()" title="登出">
      <svg width="17" height="17" viewBox="0 0 21 21" fill="none"><path d="M7.875 18.375H4.375A1.75 1.75 0 012.625 16.625V4.375A1.75 1.75 0 014.375 2.625h3.5M14 14.875L18.375 10.5 14 6.125M18.375 10.5H7.875" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="login-open-btn" onclick="openAuth()">登录</button>
  </div>
</div>

<!-- ── 手机顶栏 ── -->
<div id="mobile-topbar">
  <img id="mobile-logo" src="/static/logo.svg" alt="Reco">
  <button class="mt-btn" id="mobile-back-btn" onclick="mobileShowList()" style="display:none; flex-shrink:0;">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 5L7.5 10L12.5 15" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="mt-room" id="mobile-room-title" style="display:none"></button>
  <span id="mobile-me-title" style="display:none; flex:1; font-size:1rem; font-weight:700; padding:0 6px;"></span>
  <div id="mobile-topbar-spacer" style="flex:1"></div>
  <button id="mobile-voice-pill" onclick="mobileVoicePillClick()" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.54 8.46a5 5 0 010 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div id="mobile-voice-pill-av"></div>
    <span id="mobile-voice-pill-count"></span>
  </button>
  <button class="mt-btn" id="mobile-login-btn" onclick="openAuth()" style="font-size:0.8rem; padding:4px 10px; background:#4f8ef7; color:white; border-radius:6px; opacity:1;">登录</button>
  <div id="mobile-plus-wrap">
    <button class="mt-btn" id="mobile-plus-btn" onclick="toggleMobilePlusMenu()">
      <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M9.50004 3.95834V15.0417M3.95837 9.50001H15.0417" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="mobile-plus-dropdown" style="display:none">
      <button class="plus-menu-item" onclick="openCreateRoom();closeMobilePlusMenu()">
        <svg width="14" height="14" viewBox="0 0 19 19" fill="none"><path d="M9.5 3.958v11.084M3.958 9.5h11.084" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        创建房间
      </button>
      <button class="plus-menu-item" onclick="openFindRoom();closeMobilePlusMenu()">
        <svg width="14" height="14" viewBox="0 0 19 19" fill="none"><path d="M16.1875 16.1875L12.8344 12.8344M14.6458 8.47917C14.6458 11.8849 11.8849 14.6458 8.47917 14.6458C5.07341 14.6458 2.3125 11.8849 2.3125 8.47917C2.3125 5.07341 5.07341 2.3125 8.47917 2.3125C11.8849 2.3125 14.6458 5.07341 14.6458 8.47917Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        搜索房间
      </button>
    </div>
  </div>
  <button class="mt-btn" id="mobile-menu-btn" onclick="mobileMenuAction()" style="display:none; font-size:1.1rem;">☰</button>
  <button class="mt-btn" id="mobile-settings-btn" onclick="openSettings()" style="display:none;">
    <svg width="19" height="19" viewBox="0 0 21 21" fill="none"><path d="M10.5 13.125a2.625 2.625 0 100-5.25 2.625 2.625 0 000 5.25z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.975 13.125a1.312 1.312 0 00.263 1.449l.047.048a1.594 1.594 0 010 2.255 1.594 1.594 0 01-2.255 0l-.047-.048a1.313 1.313 0 00-1.45-.262 1.313 1.313 0 00-.795 1.2v.135a1.594 1.594 0 01-3.188 0v-.072a1.313 1.313 0 00-.858-1.2 1.313 1.313 0 00-1.45.262l-.048.048a1.594 1.594 0 01-2.254-2.255l.047-.047a1.313 1.313 0 00.263-1.45 1.313 1.313 0 00-1.2-.795h-.136a1.594 1.594 0 010-3.188h.072a1.313 1.313 0 001.2-.858 1.313 1.313 0 00-.262-1.45l-.048-.047a1.594 1.594 0 012.255-2.255l.047.047a1.313 1.313 0 001.45.263h.063a1.313 1.313 0 00.795-1.2v-.136a1.594 1.594 0 013.188 0v.072a1.313 1.313 0 00.795 1.2 1.313 1.313 0 001.45-.262l.047-.048a1.594 1.594 0 012.255 2.255l-.047.047a1.313 1.313 0 00-.263 1.45v.063a1.313 1.313 0 001.2.795h.136a1.594 1.594 0 010 3.188h-.072a1.313 1.313 0 00-1.2.795z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<!-- ── 侧栏遮罩 ── -->
<div id="sidebar-overlay" onclick="closeAllSidebars()"></div>

<!-- ── 主体三栏布局 ── -->
<div id="app">

  <!-- 左侧栏：聊天室列表 -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-rooms-title">聊天室</span>
      <button id="plus-btn" onclick="togglePlusMenu()">
        <svg width="18" height="18" viewBox="0 0 19 19" fill="none"><path d="M9.5 3.958v11.084M3.958 9.5h11.084" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <div id="plus-dropdown" style="display:none">
        <button class="plus-menu-item" onclick="openCreateRoom();closePlusMenu()">
          <svg width="14" height="14" viewBox="0 0 19 19" fill="none"><path d="M9.5 3.958v11.084M3.958 9.5h11.084" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          创建房间
        </button>
        <button class="plus-menu-item" onclick="openFindRoom();closePlusMenu()">
          <svg width="14" height="14" viewBox="0 0 19 19" fill="none"><path d="M16.1875 16.1875L12.8344 12.8344M14.6458 8.47917C14.6458 11.8849 11.8849 14.6458 8.47917 14.6458C5.07341 14.6458 2.3125 11.8849 2.3125 8.47917C2.3125 5.07341 5.07341 2.3125 8.47917 2.3125C11.8849 2.3125 14.6458 5.07341 14.6458 8.47917Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          搜索房间
        </button>
      </div>
    </div>
    <div id="sidebar-search">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 19 19" fill="none"><path d="M16.1875 16.1875L12.8344 12.8344M14.6458 8.47917C14.6458 11.8849 11.8849 14.6458 8.47917 14.6458C5.07341 14.6458 2.3125 11.8849 2.3125 8.47917C2.3125 5.07341 5.07341 2.3125 8.47917 2.3125C11.8849 2.3125 14.6458 5.07341 14.6458 8.47917Z" stroke="#87888c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="room-search" type="text" placeholder="Search..." oninput="filterRooms(this.value)" autocomplete="off" />
      </div>
    </div>
    <div id="room-list"></div>
  </div>

  <!-- 中间：聊天区 -->
  <div id="chat-area">
    <div id="no-room">请先登录或注册</div>
    <div id="chat-main" style="display:none; flex:1; flex-direction:column; min-width:0; min-height:0; overflow:hidden;">
      <div id="chat-header">
        <button id="chat-title" onclick="openRoomCard()"></button>
      </div>
      <div id="stream-panel"><div id="stream-grid"></div></div>
      <div id="stream-resize-handle"></div>
      <div id="messages"></div>
      <div id="input-area">
        <input id="msg-input" type="text" placeholder="输入消息..." />
        <button id="send-btn" onclick="sendMessage()">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M4.114 9.875h11.521M15.635 9.875L9.875 4.115M15.635 9.875L9.875 15.635" stroke="white" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 右侧栏遮罩（手机端） -->
  <div id="members-backdrop" onclick="closeMembersBar()"></div>

  <!-- 右侧栏：语音 + 成员 -->
  <div id="members-sidebar">
    <div id="voice-section">
      <div id="voice-section-title-row">
        <div id="voice-section-title">Voice Chat</div>
        <span id="voice-ping"></span>
      </div>
      <button id="voice-join-btn" onclick="joinVoice()">🎤 加入语音</button>
      <div id="voice-in-controls">
        <button id="mic-toggle" class="voice-icon-btn" onclick="toggleMute()" title="闭麦 / 开麦">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="speaker-toggle" class="voice-icon-btn" onclick="toggleSpeaker()" title="静音扬声器">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="voice-leave-btn" onclick="leaveVoice()">📵 离开语音</button>
      </div>
      <!-- 音量控制（隐藏，进阶用） -->
      <div id="voice-vol-controls" style="display:none">
        <div class="voice-vol-row">
          <input type="range" id="mic-volume" min="0" max="100" value="100" oninput="setMicVolume(this.value)" />
          <span id="mic-vol-pct" style="font-size:0.78rem;min-width:30px;text-align:right;">100%</span>
        </div>
        <div class="voice-vol-row">
          <input type="range" id="speaker-volume" min="0" max="100" value="100" oninput="setSpeakerVolume(this.value)" />
          <span id="speaker-vol-pct" style="font-size:0.78rem;min-width:30px;text-align:right;">100%</span>
        </div>
      </div>
      <button id="stream-audio-btn" onclick="toggleStreamAudio()">🖥 共享音频</button>
      <div id="live-btn-row">
        <button id="live-btn" onclick="toggleLive()">📺 直播</button>
      </div>
      <div id="stream-settings" style="display:none">
        <div class="ss-row">
          <span class="ss-label">分辨率</span>
          <select id="stream-res" onchange="updateStreamQuality()">
            <option value="480">480p</option>
            <option value="720" selected>720p</option>
            <option value="1080">1080p</option>
          </select>
        </div>
        <div class="ss-row">
          <span class="ss-label">帧率</span>
          <select id="stream-fps" onchange="updateStreamQuality()">
            <option value="5">5 fps</option>
            <option value="10">10 fps</option>
            <option value="15" selected>15 fps</option>
            <option value="24">24 fps</option>
            <option value="30">30 fps</option>
          </select>
        </div>
        <div class="ss-row">
          <span class="ss-label">码率</span>
          <select id="stream-bitrate" onchange="updateStreamQuality()">
            <option value="500000">500 kbps</option>
            <option value="1000000">1 Mbps</option>
            <option value="1500000" selected>1.5 Mbps</option>
            <option value="3000000">3 Mbps</option>
          </select>
        </div>
      </div>
      <div id="voice-members-list"></div>
    </div>
    <div id="members-divider"></div>
    <div id="sidebar-members-title">Members</div>
    <div id="member-list"></div>
  </div>

</div>

<!-- ── 登录/注册弹窗 ── -->
<div class="modal" id="auth-modal">
  <div class="modal-box">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">登录</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">注册</button>
    </div>

    <!-- 登录 -->
    <div id="login-form">
      <div class="error-msg" id="login-error"></div>
      <input id="login-username" type="text" placeholder="用户名" />
      <input id="login-password" type="password" placeholder="密码" />
      <button id="login-submit-btn" onclick="doLogin()">登录</button>
      <button id="forgot-pw-link" class="link-btn" onclick="openForgotPassword()">忘记密码？</button>
    </div>

    <!-- 注册 -->
    <div id="register-form" style="display:none">
      <div class="error-msg" id="register-error"></div>
      <input id="reg-username" type="text" placeholder="用户名（登录用，不可更改）" />
      <input id="reg-screenname" type="text" placeholder="显示名" />
      <input id="reg-password" type="password" placeholder="密码（至少6位）" />
      <textarea id="reg-bio" placeholder="个人简介（可选）" rows="2"></textarea>
      <select id="reg-question"><option value="">选择安全问题...</option></select>
      <input id="reg-answer" type="text" placeholder="安全问题答案" />
      <button id="register-submit-btn" onclick="doRegister()">注册</button>
    </div>
  </div>
</div>

<!-- ── 忘记密码弹窗 ── -->
<div class="modal" id="forgot-modal">
  <div class="modal-box">
    <h2 id="forgot-title">找回密码</h2>
    <div class="error-msg" id="forgot-error"></div>
    <div class="success-msg" id="forgot-success"></div>
    <div id="forgot-step1">
      <input id="forgot-username" type="text" placeholder="输入用户名" />
      <button id="forgot-next-btn" onclick="getForgotQuestion()">下一步</button>
    </div>
    <div id="forgot-step2" style="display:none">
      <p id="forgot-question" style="margin-bottom:12px; font-size:0.95rem;"></p>
      <input id="forgot-answer" type="text" placeholder="输入答案" />
      <input id="forgot-newpw" type="password" placeholder="新密码（至少6位）" />
      <button id="forgot-reset-btn" onclick="doResetPassword()">重置密码</button>

<!-- ── 个人资料弹窗 ── -->
<div class="modal" id="profile-modal">
  <div class="modal-box">
    <h2 id="profile-title">我的资料</h2>
    <div class="error-msg" id="profile-error"></div>
    <div class="success-msg" id="profile-success"></div>
    <input id="profile-screenname" type="text" placeholder="显示名" />
    <textarea id="profile-bio" placeholder="个人简介" rows="3"></textarea>
    <!-- 头像选择器 -->
    <div style="margin-bottom:12px;">
      <label class="avatar-picker-label">头像</label>
      <div class="avatar-preview" id="profile-avatar-preview"></div>
      <div class="av-expr-row" id="av-expr-row"></div>
      <div class="av-color-row" id="av-color-row"></div>
    </div>
    <button id="profile-save-btn" onclick="saveProfile()">保存</button>
    <button id="profile-changepw-btn" class="link-btn" onclick="openChangePassword()">修改密码</button>
    <!-- admin 专区 -->
    <div id="admin-area" style="display:none; margin-top:16px; border-top:1px solid #ddd; padding-top:16px;">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:#e74c3c;">🔑 管理员</h3>
      <div class="error-msg" id="admin-reset-error"></div>
      <div class="success-msg" id="admin-reset-success"></div>
      <input id="admin-reset-target" type="text" placeholder="输入要重置密码的用户名" />
      <button id="admin-reset-btn" class="danger-btn" onclick="doAdminReset()">重置该用户密码</button>
    </div>
    <button id="profile-close-btn" class="link-btn" style="color:#e74c3c; margin-top:8px;" onclick="closeModal('profile-modal')">关闭</button>
  </div>
</div>

<!-- ── 修改密码弹窗 ── -->
<div class="modal" id="changepw-modal">
  <div class="modal-box">
    <h2 id="changepw-title">修改密码</h2>
    <div class="error-msg" id="changepw-error"></div>
    <div class="success-msg" id="changepw-success"></div>
    <input id="old-password" type="password" placeholder="旧密码" />
    <input id="new-password" type="password" placeholder="新密码（至少6位）" />
    <input id="confirm-password" type="password" placeholder="确认新密码" />
    <button id="changepw-confirm-btn" onclick="doChangePassword()">确认修改</button>
    <button id="changepw-cancel-btn" class="link-btn" style="color:#e74c3c" onclick="closeModal('changepw-modal')">取消</button>
  </div>
</div>

<!-- ── 成员卡片弹窗 ── -->
<div class="modal" id="member-card-modal">
  <div class="modal-box">
    <h2 id="card-screenname"></h2>
    <p id="card-username" style="color:#888; font-size:0.82rem; margin-bottom:6px;"></p>
    <p id="card-bio" style="color:#999; font-size:0.95rem; margin-bottom:16px;"></p>
    <div id="card-actions" style="display:none; flex-direction:column; gap:8px; border-top:1px solid #ddd; padding-top:12px; margin-bottom:8px;">
      <button id="card-dm-btn" style="display:none; background:#4f8ef7; color:white;" onclick="openDm(cardTargetUsername)">💬 发私信</button>
      <button id="card-set-admin-btn" style="display:none" onclick="doCardSetAdmin(false)">👑 设为管理员</button>
      <button id="card-remove-admin-btn" class="danger-btn" style="display:none" onclick="doCardSetAdmin(true)">取消管理员</button>
      <button id="card-kick-btn" class="danger-btn" style="display:none" onclick="doCardKick()">🚪 踢出房间</button>
      <button id="card-invite-btn" style="display:none; background:#27ae60; color:white;" onclick="openInviteModal()">✉️ 邀请到聊天室</button>
    </div>
    <div id="card-voice-volume" style="display:none; border-top:1px solid #ddd; padding-top:12px; margin-top:4px;">
      <label id="card-voice-vol-label" style="font-size:0.85rem; color:#888; display:block; margin-bottom:6px;">🔊 语音音量</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="card-volume-slider" min="0" max="100" value="100" style="flex:1" oninput="setCardVoiceVolume(this.value)" />
        <span id="card-volume-val" style="font-size:0.85rem; min-width:36px;">100%</span>
      </div>
    </div>
    <div id="card-stream-volume" style="display:none; border-top:1px solid #ddd; padding-top:12px; margin-top:4px;">
      <label id="card-stream-vol-label" style="font-size:0.85rem; color:#888; display:block; margin-bottom:6px;">🎵 共享音频音量</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="card-stream-slider" min="0" max="100" value="80" style="flex:1" oninput="setCardStreamVolume(this.value)" />
        <span id="card-stream-val" style="font-size:0.85rem; min-width:36px;">80%</span>
      </div>
    </div>
    <button id="card-modal-close-btn" class="link-btn" style="color:#e74c3c; margin-top:12px;" onclick="closeModal('member-card-modal')">关闭</button>
  </div>
</div>

<!-- ── 房间卡片 ── -->
<div class="modal" id="room-card-modal">
  <div class="modal-box">
    <h2 id="room-card-title"></h2>
    <div id="room-card-code-area" style="display:flex; align-items:center; gap:8px; margin-top:8px;">
      <span id="room-code-label" style="font-size:0.85rem; color:#888;">房间号：</span>
      <span id="room-card-code" style="font-size:1.1rem; font-weight:bold; letter-spacing:2px;"></span>
      <button id="room-code-copy-btn" class="link-btn" style="font-size:0.8rem;" onclick="copyRoomCode()">复制</button>
    </div>
    <div id="room-card-admin-btns" style="display:none; flex-direction:column; gap:10px; margin-top:12px;">
      <button id="room-pw-toggle-btn" onclick="toggleRoomPasswordAction()"></button>
      <div id="room-pw-set-area" style="display:none; flex-direction:column; gap:6px;">
        <input id="room-new-pw-input" type="password" placeholder="输入新密码" />
        <div class="error-msg" id="room-pw-set-error"></div>
        <button id="room-pw-confirm-btn" onclick="submitSetRoomPassword()">确认设置</button>
      </div>
      <button id="room-card-close-btn" onclick="confirmCloseRoomFromCard()" style="background:#e74c3c; color:white;">🗑 关闭房间</button>
    </div>
    <div id="room-card-leave-area" style="margin-top:12px;">
      <button id="room-card-leave-btn" onclick="leaveRoomFromCard()" style="width:100%; padding:8px; background:#e74c3c; color:white; border:none; border-radius:6px; cursor:pointer;">退出房间</button>
    </div>
    <button id="room-card-modal-close" class="link-btn" style="margin-top:10px;" onclick="closeModal('room-card-modal')">关闭</button>
  </div>
</div>

<!-- ── 搜索房间弹窗 ── -->
<div class="modal" id="find-room-modal">
  <div class="modal-box">
    <h2 id="find-room-title">🔍 搜索房间</h2>
    <div class="error-msg" id="find-room-error"></div>
    <input id="find-room-code" type="text" placeholder="输入房间号（6位数字）" maxlength="6" style="letter-spacing:2px;" />
    <button id="find-room-confirm-btn" onclick="doFindRoom()">搜索</button>
    <button id="find-room-cancel-btn" class="link-btn" style="color:#e74c3c" onclick="closeModal('find-room-modal')">取消</button>
  </div>
</div>

<!-- ── 邀请选择房间弹窗 ── -->
<div class="modal" id="invite-room-modal">
  <div class="modal-box">
    <h2 id="invite-room-title">邀请到聊天室</h2>
    <p id="invite-target-name" style="color:#888; font-size:0.9rem; margin-bottom:12px;"></p>
    <div id="invite-room-list" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto;"></div>
    <button id="invite-room-cancel-btn" class="link-btn" style="color:#e74c3c; margin-top:12px;" onclick="closeModal('invite-room-modal')">取消</button>
  </div>
</div>

<!-- ── 邀请通知弹窗 ── -->
<div class="modal" id="invite-notify-modal">
  <div class="modal-box">
    <h2 id="invite-notify-title">📩 房间邀请</h2>
    <p id="invite-notify-text" style="margin-bottom:16px;"></p>
    <div style="display:flex; gap:10px;">
      <button id="invite-accept-btn" style="flex:1; background:#27ae60; color:white;" onclick="acceptInvite()">接受</button>
      <button id="invite-decline-btn" style="flex:1;" class="danger-btn" onclick="declineInvite()">拒绝</button>
    </div>
  </div>
</div>

<!-- ── 设置弹窗 ── -->
<div class="modal" id="settings-modal">
  <div class="modal-box" style="max-width:420px; width:90%;">
    <h2 id="settings-title">⚙️ 设置</h2>
    <div class="tabs" style="margin-bottom:16px;">
      <button class="tab active" id="settings-tab-general" onclick="switchSettingsTab('general')">通用</button>
      <button class="tab" id="settings-tab-audio" onclick="switchSettingsTab('audio')">🎵 音频</button>
    </div>
    <div id="settings-audio-panel" style="display:none;">
      <div style="margin-bottom:14px;">
        <label id="settings-mic-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:6px;">🎤 麦克风</label>
        <select id="mic-select" style="width:100%; padding:6px; border-radius:6px; border:1px solid #ddd;" onchange="saveMicDevice(this.value)"></select>
      </div>
      <div style="margin-bottom:14px;">
        <label id="settings-speaker-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:6px;">🔊 扬声器</label>
        <select id="speaker-select" style="width:100%; padding:6px; border-radius:6px; border:1px solid #ddd;" onchange="saveSpeakerDevice(this.value)"></select>
      </div>
      <div>
        <label id="settings-mic-test-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:8px;">🎚️ 麦克风测试</label>
        <div id="mic-test-bar" style="display:none; background:#eee; border-radius:4px; height:10px; margin-bottom:10px; overflow:hidden;">
          <div id="mic-test-level" style="height:100%; width:0%; background:#4f8ef7; transition:width 0.05s;"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="start-mic-test-btn" onclick="startMicTest()">▶ 开始测试</button>
          <button id="stop-mic-test-btn" style="display:none;" onclick="stopMicTest()">■ 停止</button>
        </div>
      </div>
    </div>
    <div id="settings-general-panel">
      <div>
        <label id="settings-lang-label" style="display:block; font-size:0.85rem; color:#888; margin-bottom:8px;">🌐 语言 / Language</label>
        <div style="display:flex; gap:8px;">
          <button class="tab active" id="lang-zh-btn" onclick="setLang('zh')">中文</button>
          <button class="tab" id="lang-en-btn" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
    <button id="settings-close-btn" class="link-btn" style="color:#e74c3c; margin-top:20px;" onclick="closeSettings()">关闭</button>
  </div>
</div>

<!-- ── 房间密码弹窗 ── -->
<div class="modal" id="room-pw-modal">
  <div class="modal-box">
    <h2 id="room-pw-modal-title">🔒 输入房间密码</h2>
    <div class="error-msg" id="room-pw-error"></div>
    <input id="room-pw-input" type="password" placeholder="密码" />

      <input type="checkbox" id="room-pw-remember" /> 记住密码
    </label>
    <button id="room-pw-enter-btn" onclick="submitRoomPassword()">进入</button>
    <button id="room-pw-cancel-btn" class="link-btn" style="color:#e74c3c" onclick="closeModal('room-pw-modal')">取消</button>
  </div>
</div>

<!-- ── 创建房间弹窗 ── -->
<div class="modal" id="create-room-modal">

    <button id="create-room-confirm-btn" onclick="doCreateRoom()">创建</button>
    <button id="create-room-cancel-btn" class="link-btn" style="color:#e74c3c" onclick="closeModal('create-room-modal')">取消</button>
  </div>
</div>
