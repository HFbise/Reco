<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>聊天室</title>
  <style>
body {
  font-family: sans-serif;
  max-width: 600px;
  margin: 40px auto;
  padding: 0 20px;
  background: #ffffff;
  color: #000000;
  transition: background 0.3s, color 0.3s;
}
body.dark {
  background: #1a1a2e;
  color: #e0e0e0;
}
#messages {
  border: 1px solid #ccc;
  height: 400px;
  overflow-y: auto;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
}
body.dark #messages {
  border-color: #444;
  background: #16213e;
}
.msg { margin: 8px 0; word-break: break-word; white-space: pre-wrap; }
.msg span { font-weight: bold; color: #555; }
body.dark .msg span { color: #aaa; }
#input-area { display: flex; gap: 8px; }
#nickname {
  width: 120px; padding: 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: inherit;
  color: inherit;
}
#msg {
  flex: 1; padding: 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: inherit;
  color: inherit;
}
body.dark #nickname, body.dark #msg {
  border-color: #444;
}
button {
  padding: 8px 16px;
  background: #4f8ef7;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
#theme-btn {
  float: right;
  background: #888;
  margin-bottom: 8px;
}
  </style>
</head>
<body>
  <h2>💬 聊天室 <button id="theme-btn" onclick="toggleTheme()">🌙 夜间</button></h2>
  <div id="messages"></div>
  <div id="input-area">
    <input id="nickname" type="text" placeholder="你的名字" />
    <input id="msg" type="text" placeholder="输入消息..." />
    <button onclick="sendMessage()">发送</button>
  </div>

  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <script>
    const socket = io();
    function toggleTheme() {
  document.body.classList.toggle('dark');
  const btn = document.getElementById('theme-btn');
  btn.textContent = document.body.classList.contains('dark') ? '☀️ 白天' : '🌙 夜间';
}

    socket.on('message', function(data) {
      const div = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.innerHTML = `<span>${data.nickname}：</span>${data.text}`;
      div.appendChild(msg);
      div.scrollTop = div.scrollHeight;
    });

    function sendMessage() {
      const nickname = document.getElementById('nickname').value || '匿名';
      const text = document.getElementById('msg').value;
      if (!text) return;
      socket.emit('message', { nickname, text });
      document.getElementById('msg').value = '';
    }

    document.getElementById('msg').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
